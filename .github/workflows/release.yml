# Release builds. A tag v<major>.<minor>.<patch> on main runs the checks of
# ci.yml on that commit, builds the three release archives with each
# platform's packaging/*/make-release script (the same scripts used by hand,
# with all their checks), checks them and publishes them on the Releases page
# with their SHA-256. A manual run does everything but publish, so the checks
# are tried too. No job installs a service, touches a network interface or
# needs a secret; only the publishing job, which builds and runs nothing from
# the repository, may write.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.platform }})
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            archive: linux-x86_64.tar.gz
          - platform: macos
            os: macos-15
            archive: macos-arm64.zip
          - platform: windows
            os: windows-2025
            archive: windows-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No cache: nothing another run left behind goes into a release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Tools
        shell: bash
        run: |
          uname -a
          node --version
          pnpm --version
          cargo --version

      - name: Build the release (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/make-release.sh

      # macOS's own bash 3.2, as on a Mac.
      - name: Build the release (macOS)
        if: runner.os == 'macOS'
        run: /bin/bash packaging/macos/make-release.sh

      # Windows PowerShell 5.1, as on the developer's computer, in a process
      # of its own.
      - name: Build the release (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging\windows\make-release.ps1
          exit $LASTEXITCODE

      # Exactly one archive, of the version the next job checks.
      - name: The archive
        id: archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(dist/wgal-*-"$ARCHIVE")
          if [ "${#found[@]}" -ne 1 ]; then
            echo "expected one archive in dist/, found ${#found[@]}"
            exit 1
          fi
          echo "path=${found[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wgal-${{ matrix.platform }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Read only, on every run: the three archives, their records, the commit
  # and the notes. Its notes and SHA256SUMS are what the next job publishes.
  verify:
    name: verify
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: wgal-*
          merge-multiple: true

      - name: Check the archives and write the notes
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse 'HEAD^{commit}')

          # The workspace's version, which every archive's name carries; a
          # tag must name the same one.
          version=$(sed -n '/^\[workspace\.package\]$/,/^\[/s/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' Cargo.toml)
          if ! grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' <<< "$version"; then
            echo "the workspace version could not be read"
            exit 1
          fi
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "the tag $REF_NAME does not name the workspace version $version"
            exit 1
          fi
          names=("wgal-$version-windows-x64.zip" "wgal-$version-macos-arm64.zip" "wgal-$version-linux-x86_64.tar.gz")

          # Exactly the three archives, nothing else.
          have=$(cd artifacts && ls -A | LC_ALL=C sort)
          want=$(printf '%s\n' "${names[@]}" | LC_ALL=C sort)
          if [ "$have" != "$want" ]; then
            echo "the artifacts are not the three archives of $version"
            exit 1
          fi

          # Each archive's record names this version and this commit (the
          # Windows record has CRLF line ends).
          for name in "${names[@]}"; do
            folder=${name%.tar.gz}
            folder=${folder%.zip}
            case "$name" in
              *.zip) record=$(unzip -p "artifacts/$name" "$folder/RELEASE.txt" | tr -d '\r') ;;
              *) record=$(tar -xzOf "artifacts/$name" "$folder/RELEASE.txt" | tr -d '\r') ;;
            esac
            if ! grep -qxF "Version $version: the window, the watchdog, wgal-mcp and wgal" <<< "$record" ||
              ! grep -qxF "Commit $commit" <<< "$record"; then
              echo "$name: its RELEASE.txt does not name version $version and commit $commit"
              exit 1
            fi
          done

          # Only a commit on main is released.
          status=$(gh api "repos/$REPO/compare/main...$commit" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "commit $commit is not on main ($status)"; exit 1 ;;
          esac

          # The notes: this version's CHANGELOG entry, then the SHA-256.
          mkdir notes
          awk -v head="## $version (" '
            index($0, head) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "CHANGELOG.md has no entry for $version"
            exit 1
          fi
          (cd artifacts && sha256sum "${names[@]}") > notes/SHA256SUMS
          {
            echo
            echo "## SHA-256"
            echo
            echo "| Archive | SHA-256 |"
            echo "|---|---|"
            while read -r hash name; do
              echo "| \`$name\` | \`$hash\` |"
            done < notes/SHA256SUMS
            echo
            echo "Built by [GitHub Actions]($RUN_URL) from commit \`$commit\` with each platform's \`packaging/*/make-release\` script. Not code-signed: see [packaging/INSTALL.md](https://github.com/$REPO/blob/v$version/packaging/INSTALL.md)."
          } >> notes/notes.md
          cat notes/notes.md
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/
          if-no-files-found: error
          retention-days: 7

  # Only from a tag: a draft with the checked files, the uploaded files
  # checked again, then published.
  publish:
    name: publish
    needs: verify
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: wgal-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes

      # A failure after the draft is made leaves the draft, which only the
      # repository's writers see; AGENTS.md says what to do with it.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          [ "$TAG" = "v$VERSION" ] || { echo "the tag is not v$VERSION"; exit 1; }

          # The tag still names the commit that was built.
          tag_names_commit() {
            local ref
            ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
            if [ "${ref%% *}" = tag ]; then
              ref=$(gh api "repos/$REPO/git/tags/${ref#* }" --jq '.object.type + " " + .object.sha')
            fi
            if [ "$ref" != "commit $COMMIT" ]; then
              echo "the tag $TAG no longer names commit $COMMIT"
              return 1
            fi
          }

          tag_names_commit
          (cd artifacts && sha256sum -c ../notes/SHA256SUMS)
          gh release create "$TAG" --repo "$REPO" --verify-tag --draft \
            --title "WG Always Live $VERSION" --notes-file notes/notes.md \
            artifacts/* notes/SHA256SUMS

          # What was uploaded is what verify checked: its SHA256SUMS, and
          # the three archives against it.
          mkdir uploaded
          gh release download "$TAG" --repo "$REPO" --dir uploaded
          cmp notes/SHA256SUMS uploaded/SHA256SUMS
          (cd uploaded && sha256sum -c ../notes/SHA256SUMS)
          [ "$(ls -A uploaded | wc -l)" -eq 4 ]

          tag_names_commit
          gh release edit "$TAG" --repo "$REPO" --draft=false
