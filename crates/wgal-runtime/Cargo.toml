[package]
name = "wgal-runtime"
description = "Watchdog runtime: IPC server, persistence, notifications and the background service entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["telegram"]
# The HTTPS client for the Telegram Bot API. Its TLS stack builds C code, so
# cross type-checks from another OS run with --no-default-features.
telegram = ["dep:ureq"]

[dependencies]
wgal-core.workspace = true
wgal-platform.workspace = true
wgal-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
# The host name messages give when no device name is set.
gethostname.workspace = true
ureq = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# SIGTERM and SIGINT stop the Linux and macOS watchdog cleanly (socket/host.rs).
signal-hook.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true

[[bin]]
name = "wgal-watchdog"
path = "src/bin/wgal-watchdog.rs"

[dev-dependencies]
wgal-testkit.workspace = true

[lints]
workspace = true
