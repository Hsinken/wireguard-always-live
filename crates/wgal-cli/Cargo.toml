[package]
name = "wgal-cli"
description = "wgal: WGAL's command line, in English, for the watchdog's settings and operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wgal"
path = "src/main.rs"

[dependencies]
wgal-protocol.workspace = true
# The way to the watchdog, shared with wgal-mcp.
wgal-client.workspace = true
serde.workspace = true
serde_json.workspace = true
# Times in the watchdog's configured zone, as its Telegram messages give
# them.
jiff.workspace = true

# Only for `terminal::HiddenInput`: the Bot Token is typed unseen; nothing
# else.
[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
wgal-platform.workspace = true

[lints]
workspace = true
